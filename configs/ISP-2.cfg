!
version 15.1
no service timestamps log datetime msec
no service timestamps debug datetime msec
no service password-encryption
!
hostname ISP-2
!
!
!
!
!
!
!
!
no ip cef
ipv6 unicast-routing
!
no ipv6 cef
!
!
!
!
license udi pid CISCO2911/K9 sn FTX1524H7T6-
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface Loopback0
 ip address 9.9.9.9 255.255.255.255
!
interface GigabitEthernet0/0
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface GigabitEthernet0/1
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface GigabitEthernet0/2
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Serial0/3/0
 ip address 203.0.113.5 255.255.255.252
 ip access-group 1 in
 ipv6 address 2001:DB8:C::/64 eui-64
 ipv6 eigrp 1
 clock rate 4000000
!
interface Serial0/3/1
 ip address 203.0.113.10 255.255.255.252
 ipv6 address 2001:DB8:F::/64 eui-64
 ipv6 eigrp 1
!
interface Vlan1
 no ip address
 shutdown
!
ipv6 router eigrp 1
 eigrp router-id 9.9.9.9
 no shutdown 
!
ip classless
ip route 0.0.0.0 0.0.0.0 203.0.113.6 2
ip route 8.8.8.8 255.255.255.255 203.0.113.9 
!
ip flow-export version 9
!
ipv6 route ::/0 2001:DB8:C:0:240:BFF:FE19:9101
!
access-list 1 deny 10.0.0.0 0.255.255.255
access-list 1 deny 172.16.0.0 0.15.255.255
access-list 1 deny 192.168.0.0 0.0.255.255
access-list 1 permit any
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end

